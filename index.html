<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granja Avícola 1 - Sincronizado</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f5f7f0;padding:12px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:1.5rem}
.btn{background:#2e7d32;color:white;border:none;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:1rem}
.badge{background:#e8f5e9;color:#2e7d32;padding:4px 10px;border-radius:20px;font-size:.8rem}
#status{padding:10px;border-radius:10px;margin:10px 0;font-size:.85rem;background:#e3f2fd}
</style>
</head>
<body>

<div class="card">
<h1>🐔 Granja Avícola 1</h1>
<div id="status">🔄 Conectando...</div>
<p style="font-size:.8rem;color:#666;margin-top:6px">Sincronizado en la nube para todos los celulares<br>https://patricioripalda1.github.io/Granja-avicola1/</p>
</div>

<div class="card">
<h3>➕ Registrar Lote</h3>
<input id="lote" placeholder="Nombre lote Ej: Lote A1">
<input id="cantidad" type="number" placeholder="Cantidad de pollos">
<input id="peso" type="number" step="0.1" placeholder="Peso promedio kg">
<button class="btn" onclick="guardar()">💾 Guardar en la Nube</button>
</div>

<div class="card">
<h3>📋 Registros en Tiempo Real</h3>
<div id="lista">Cargando datos de la nube...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, orderBy, query } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsD1QQEhCmWb-jyUrseX_MED5MybToVw",
  authDomain: "granja-avicola-680a4.firebaseapp.com",
  projectId: "granja-avicola-680a4",
  storageBucket: "granja-avicola-680a4.firebasestorage.app",
  messagingSenderId: "638899791445",
  appId: "1:638899791445:web:7e6d58507f22198ddb6dc",
  measurementId: "G-JQ7QWMRECF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('status').innerHTML = "✅ Conectado - Todo lo que guardes se verá en todos los celulares";

window.guardar = async () => {
  const lote = document.getElementById('lote').value.trim();
  const cantidad = document.getElementById('cantidad').value;
  const peso = document.getElementById('peso').value;
  if(!lote || !cantidad){ alert("Escribe lote y cantidad"); return; }
  try{
    await addDoc(collection(db, "lotes"), {
      lote, cantidad: Number(cantidad), peso: Number(peso)||0,
      fecha: serverTimestamp(),
      creado: new Date().toLocaleString()
    });
    document.getElementById('lote').value="";
    document.getElementById('cantidad').value="";
    document.getElementById('peso').value="";
  }catch(e){ alert("Error: "+e.message); }
};

const q = query(collection(db, "lotes"), orderBy("fecha","desc"));
onSnapshot(q, (snap)=>{
  const lista = document.getElementById('lista');
  if(snap.empty){ lista.innerHTML="<p style='color:#999'>Aún no hay registros. ¡Guarda el primero!</p>"; return; }
  let html="";
  snap.forEach(doc=>{
    const d=doc.data();
    html+=`<div style="border-bottom:1px solid #eee;padding:10px 0"><b>${d.lote}</b> <span class="badge">${d.cantidad} pollos</span><br><small style="color:#666">Peso: ${d.peso} kg - ${d.creado||""}</small></div>`;
  });
  lista.innerHTML=html;
});
</script>

</body>
</html>
